<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="과학 농업 기술의 선두 주자 리팜바이오(주) - 생육 단계별 최적 제품 솔루션을 제공합니다.">
    <title>리팜바이오(주) - 과학 농업 기술의 선두 주자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header" id="header">
        <div class="header-inner">
            <h1 class="logo">
                <span class="logo-highlight">과학 농업 기술의 선두 주자 !</span> 리팜바이오<span class="logo-corp">㈜</span>
            </h1>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="메뉴 열기">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav" id="mainNav">
                <a href="#" class="nav-link" id="nav-notice">공지사항</a>
                <a href="#" class="nav-link" id="nav-greeting">인사말</a>
                <a href="#" class="nav-link" id="nav-location">찾아오시는길</a>
                <a href="#" class="nav-link" id="nav-board">게시판</a>
            </nav>
        </div>
    </header>

    <!-- 히어로 섹션 -->
    <section class="hero" id="hero">
        <div class="hero-bg">
            <img src="assets/bg-main.png" alt="스마트팜 배경" class="hero-bg-img">
            <div class="hero-overlay"></div>
        </div>

        <div class="hero-content">
            <div class="welcome-row">
                <p class="guide-text animate-in">
                    <span class="guide-icon">👇</span> 아래 단어를 누르시면 자료가 보입니다
                </p>
                <p class="welcome-text animate-in">
                    리팜바이오<span class="welcome-corp">㈜</span> 홈페이지 오신걸 환영합니다
                </p>
            </div>

            <!-- 제품 테이블 -->
            <div class="product-table-wrapper animate-in">
                <div class="product-table">
                    <!-- 테이블 헤더 -->
                    <div class="table-header">
                        <div class="col-stage">생육 단계</div>
                        <div class="col-products">사용 가능한 리판바이오 제품명</div>
                    </div>

                    <!-- 정식기 -->
                    <div class="table-row" data-stage="정식기">
                        <div class="stage-cell">
                            <span class="stage-name">정식기</span>
                            <span class="stage-desc">(밑거름, 침종, 초기 생육)</span>
                        </div>
                        <div class="products-cell">
                            <button class="product-btn" data-product="프로타민(입제/액제)" onclick="goDetail(this)">프로타민(입제/액제)</button>
                            <button class="product-btn" data-product="아그로믹(입제)" onclick="goDetail(this)">아그로믹(입제)</button>
                            <button class="product-btn" data-product="아그로믹스" onclick="goDetail(this)">아그로믹스</button>
                            <button class="product-btn" data-product="바다해유기" onclick="goDetail(this)">바다해유기</button>
                            <button class="product-btn" data-product="오뚜기 골드" onclick="goDetail(this)">오뚜기 골드</button>
                            <button class="product-btn" data-product="다루마" onclick="goDetail(this)">다루마</button>
                            <button class="product-btn" data-product="매구미" onclick="goDetail(this)">매구미</button>
                            <button class="product-btn" data-product="카이사르" onclick="goDetail(this)">카이사르</button>
                            <button class="product-btn" data-product="황제균" onclick="goDetail(this)">황제균</button>
                            <button class="product-btn" data-product="유레카" onclick="goDetail(this)">유레카</button>
                            <button class="product-btn" data-product="금단비(금비아)" onclick="goDetail(this)">금단비(금비아)</button>
                        </div>
                    </div>

                    <!-- 개화기 -->
                    <div class="table-row" data-stage="개화기">
                        <div class="stage-cell">
                            <span class="stage-name">개화기</span>
                        </div>
                        <div class="products-cell">
                            <button class="product-btn highlight-red" data-product="금단비(금비아)" onclick="goDetail(this)">금단비(금비아)</button>
                            <button class="product-btn highlight-green" data-product="켈프팜" onclick="goDetail(this)">켈프팜</button>
                            <button class="product-btn" data-product="마니플렉스 칼막" onclick="goDetail(this)">마니플렉스 칼막</button>
                            <button class="product-btn" data-product="비바" onclick="goDetail(this)">비바</button>
                            <button class="product-btn" data-product="클로립" onclick="goDetail(this)">클로립</button>
                            <button class="product-btn" data-product="프로타민(액상)" onclick="goDetail(this)">프로타민(액상)</button>
                        </div>
                    </div>

                    <!-- 착과기 -->
                    <div class="table-row" data-stage="착과기">
                        <div class="stage-cell">
                            <span class="stage-name">착과기</span>
                        </div>
                        <div class="products-cell">
                            <button class="product-btn highlight-red" data-product="금단비(금비아)" onclick="goDetail(this)">금단비(금비아)</button>
                            <button class="product-btn highlight-green" data-product="보락스33" onclick="goDetail(this)">보락스33</button>
                            <button class="product-btn" data-product="마니플렉스 칼막" onclick="goDetail(this)">마니플렉스 칼막</button>
                            <button class="product-btn" data-product="맥스마이즈" onclick="goDetail(this)">맥스마이즈</button>
                            <button class="product-btn" data-product="비바 클로립" onclick="goDetail(this)">비바 클로립</button>
                        </div>
                    </div>

                    <!-- 비대기 -->
                    <div class="table-row" data-stage="비대기">
                        <div class="stage-cell">
                            <span class="stage-name">비대기</span>
                        </div>
                        <div class="products-cell">
                            <button class="product-btn highlight-green large-btn" data-product="TS 빅, 마니플렉스 케이" onclick="goDetail(this)">TS 빅,<br>마니플렉스 케이,</button>
                            <button class="product-btn highlight-green large-btn" data-product="피드 빅" onclick="goDetail(this)">피드 빅,</button>
                            <button class="product-btn highlight-green large-btn" data-product="왕방울 빅, 유레카" onclick="goDetail(this)">왕방울 빅,<br>유레카</button>
                            <button class="product-btn highlight-green large-btn" data-product="비비오오다마" onclick="goDetail(this)">비비오오다마,</button>
                            <button class="product-btn" data-product="마니플렉스 칼막" onclick="goDetail(this)">마니플렉스 칼막</button>
                        </div>
                    </div>

                    <!-- 착색기 -->
                    <div class="table-row" data-stage="착색기">
                        <div class="stage-cell">
                            <span class="stage-name">착색기</span>
                            <span class="stage-desc">(수확 전 숙기)</span>
                        </div>
                        <div class="products-cell">
                            <button class="product-btn" data-product="슈가렉스(K슈가렉스)" onclick="goDetail(this)">슈가렉스(K슈가렉스)</button>
                            <button class="product-btn" data-product="마니플렉스 K" onclick="goDetail(this)">마니플렉스 K</button>
                            <button class="product-btn" data-product="유기포타슘" onclick="goDetail(this)">유기포타슘</button>
                            <button class="product-btn" data-product="참진칼" onclick="goDetail(this)">참진칼</button>
                            <button class="product-btn" data-product="유레카(13)" onclick="goDetail(this)">유레카(13)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 푸터 -->
    <footer class="footer">
        <p>&copy; 2026 리팜바이오(주). All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
